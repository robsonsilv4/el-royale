[project]
name = "el-royale"
version = "0.1.0"
description = "API RESTful de gerenciamento de hotéis e quartos em Django REST Framework (desafio Stopover)"
requires-python = ">=3.14"
dependencies = [
    "django~=5.2",
    "psycopg2-binary",
    "djangorestframework~=3.16",
    "djangorestframework-simplejwt~=5.5",
    "django-filter~=25.1",
    "django-cors-headers~=4.7",
    "drf-nested-routers~=0.93.5",
    "drf-spectacular~=0.28",
    "packaging",
]

[dependency-groups]
dev = [
    "coverage>=7.15.4",
    "mutmut>=3.7.0",
    "pre-commit",
    "pytest>=9.1.1",
    "pytest-django>=4.14.0",
    "ruff",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.test_settings"
pythonpath = ["."]
addopts = ["-q"]
python_files = ["tests.py", "test_*.py", "*_test.py"]
norecursedirs = ["mutants"]

[tool.ruff]
target-version = "py314"
line-length = 88
extend-exclude = ["*/migrations/*", "mutants"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "RUF", "W"]

[tool.ruff.format]
quote-style = "double"

[tool.coverage.run]
source = ["users", "hotels", "rooms", "config"]
branch = true
omit = ["*/migrations/*"]

[tool.coverage.report]
show_missing = true
fail_under = 100

[tool.mutmut]
source_paths = ["config", "users", "hotels", "rooms"]
pytest_add_cli_args = [
    "--ds",
    "config.test_settings",
    "-o",
    "django_find_project=false",
]
do_not_mutate = [
    "*/migrations/*",
    "*/tests.py",
    "config/test_settings.py",
    "*/wsgi.py",
    "*/apps.py",
    "*/admin.py",
]
