[project]
name = "el-royale"
version = "0.1.0"
description = "API para gerenciamento de cadastro de hotéis"
requires-python = ">=3.14"
dependencies = [
    "django~=5.2",
    "psycopg2-binary",
    "djangorestframework~=3.16",
    "djangorestframework-simplejwt~=5.5",
    "django-filter~=25.1",
    "django-cors-headers~=4.7",
    "drf-nested-routers~=0.93.5",
    "drf-spectacular~=0.28",
    "packaging",
]

[dependency-groups]
dev = [
    "coverage>=7.15.4",
    "pre-commit",
    "ruff",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py314"
line-length = 88
extend-exclude = ["*/migrations/*"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "RUF", "W"]

[tool.ruff.format]
quote-style = "double"

[tool.coverage.run]
source = ["users", "hotels", "rooms", "config"]
branch = true
omit = ["*/migrations/*"]

[tool.coverage.report]
show_missing = true
fail_under = 100
